<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temp Mail Admin Login</title>
<style>
body{font-family:Arial;background:#101827;color:#eef2ff;display:grid;place-items:center;min-height:100vh;margin:0}
.card{background:#1e293b;padding:28px;border-radius:16px;width:min(88%,360px)}
input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border-radius:8px;border:0}
button{background:#38bdf8;font-weight:bold}small{color:#fca5a5}
</style></head><body>
<form class="card" method="post" action="/login">
<h2>Temp Mail Admin</h2><p>Sign in to continue</p>
{% if error %}<small>{{ error }}</small>{% endif %}
<input type="hidden" name="csrf" value="{{ csrf_token }}">
<input name="username" placeholder="Username" autocomplete="username" required>
<input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
<button type="submit">Login</button>
</form></body></html>

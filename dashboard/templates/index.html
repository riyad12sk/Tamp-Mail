<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temp Mail Dashboard</title><style>
body{font-family:Arial;background:#0f172a;color:#e2e8f0;margin:0;padding:20px}.wrap{max-width:1000px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.card{background:#1e293b;padding:20px;border-radius:14px}
.num{font-size:30px;font-weight:bold;color:#7dd3fc}table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:12px;overflow:hidden}
td,th{text-align:left;padding:12px;border-bottom:1px solid #334155;font-size:13px;overflow-wrap:anywhere}
button{padding:10px 16px;border:0;border-radius:8px;background:#38bdf8}form{margin:16px 0}
</style></head><body><div class="wrap"><h1>Temp Mail Admin Dashboard</h1><p>Service overview</p>
<div class="grid"><div class="card">Users<div class="num">{{ users }}</div></div>
<div class="card">Email accounts<div class="num">{{ emails }}</div></div>
<div class="card">Messages<div class="num">{{ messages }}</div></div></div>
<h2>Recent activity</h2><table><tr><th>Telegram ID</th><th>Action</th><th>Details</th><th>Time (UTC)</th></tr>
{% for r in recent %}<tr><td>{{ r.telegram_id }}</td><td>{{ r.action }}</td><td>{{ r.details or '' }}</td><td>{{ r.created_at }}</td></tr>{% endfor %}
</table><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button type="submit">Log out</button></form>
</div></body></html>
